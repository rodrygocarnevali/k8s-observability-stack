name: CI Demo API

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
test:
runs-on: ubuntu-latest
defaults:
run:
working-directory: demo-api

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-go@v5
    with:
      go-version: '1.26'

  - run: go mod download

  - run: go test ./...

  - run: go build -o demo-api .
```

docker:
runs-on: ubuntu-latest
needs: test

```
steps:
  - uses: actions/checkout@v4

  - run: docker build -t demo-api:${{ github.sha }} ./demo-api
```
